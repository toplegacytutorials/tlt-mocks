<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdomen & Pelvis Mock | TLT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 190px; }
        .circle-bg { fill: none; stroke: #1e293b; stroke-width: 3.8; }
        .circle { fill: none; stroke-width: 3.8; stroke-linecap: round; animation: progress 1.2s ease-out forwards; }
        @keyframes progress { 0% { stroke-dasharray: 0 100; } }
        .percentage { fill: #f8fafc; font-size: 0.6em; text-anchor: middle; font-weight: 700; }
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #020617; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; border: 2px solid #020617; }
        .option-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-4xl bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden min-h-[600px] flex flex-col relative">
        <!-- Assessment Injected Here -->
    </div>

    <script>
        const EXAM_KEY = "abdomen_pelvis";
        const EXAM_SUBJECT = "Anatomy";
        const EXAM_TOPIC = "Abdomen & Pelvis Mock";
        const TOTAL_TIME_SECONDS = 300; 
        const WEB3FORMS_ACCESS_KEY = "a9cd9997-29c3-486f-9667-bb01dfdb0375";

        const rawQuestions = [
            { 
                q: "Which vascular structure forms the posterior immediate boundary of the epiploic foramen of Winslow?", 
                c: "Inferior vena cava", 
                i: ["Portal vein", "Proper hepatic artery", "Superior mesenteric vein"], 
                r: "The epiploic foramen is bounded anteriorly by the hepatoduodenal ligament (containing the portal triad) and posteriorly by the inferior vena cava covered by parietal peritoneum." 
            },
            { 
                q: "During surgical division of the gastrosplenic ligament, which vessels are at risk of transection?", 
                c: "Short gastric and left gastroepiploic arteries", 
                i: ["Right gastric and gastroduodenal arteries", "Splenic artery trunk and dorsal pancreatic artery", "Left gastric and right gastroepiploic arteries"], 
                r: "The gastrosplenic ligament connects the greater curvature of the stomach to the splenic hilum and carries the short gastric vessels and the left gastroepiploic vessels." 
            },
            { 
                q: "A direct inguinal hernia protrudes through Hesselbach's triangle. Which structure defines the lateral border of this triangle?", 
                c: "Inferior epigastric vessels", 
                i: ["Lateral border of rectus abdominis", "Inguinal ligament (Poupart's ligament)", "Ilioinguinal nerve"], 
                r: "Hesselbach's inguinal triangle is bounded medially by the lateral border of rectus abdominis, laterally by the inferior epigastric vessels, and inferiorly by the inguinal ligament." 
            },
            { 
                q: "The internal anal sphincter is an anatomical continuation of which smooth muscle coat of the gastrointestinal tract?", 
                c: "Inner circular muscularis layer", 
                i: ["Outer longitudinal muscularis layer", "Muscularis mucosae", "Puborectalis sling"], 
                r: "The internal anal sphincter represents the natural hypertrophy and continuation of the inner circular layer of rectal smooth muscle." 
            },
            { 
                q: "Visceral afferent fibers transmitting initial, poorly-localized umbilical pain in acute appendicitis enter the spinal cord at which segment?", 
                c: "T10 spinal cord level", 
                i: ["T8 spinal cord level", "T12 spinal cord level", "L1 spinal cord level"], 
                r: "Visceral pain from the appendix accompanies sympathetic afferents via the lesser splanchnic nerve to the T10 spinal cord segment, producing referred pain in the periumbilical region." 
            }
        ];

        let candidateID = ""; 
        let candidateDept = ""; 
        let questions = []; 
        let currentQ = 0; 
        let answers = {}; 
        let timeLeft = TOTAL_TIME_SECONDS; 
        let isSubmitted = false; 
        let timerInterval;
        let examStartTime = 0;
        const appDiv = document.getElementById('app');

        const icons = {
            user: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
            book: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /></svg>`,
            clock: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`,
            x: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`
        };

        function getActiveStateKey(id) {
            return `tlt_active_exam_${EXAM_KEY}_${id}`;
        }

        function saveActiveState() {
            if (!candidateID || isSubmitted) return;
            const state = {
                candidateID,
                candidateDept,
                questions,
                currentQ,
                answers,
                examStartTime,
                totalTime: TOTAL_TIME_SECONDS
            };
            localStorage.setItem(getActiveStateKey(candidateID), JSON.stringify(state));
        }

        function clearActiveState() {
            if (candidateID) {
                localStorage.removeItem(getActiveStateKey(candidateID));
            }
        }

        function initApp() {
            const rawSession = localStorage.getItem('tlt_session');
            let sessionID = "";
            if (rawSession) {
                try {
                    const session = JSON.parse(rawSession);
                    sessionID = session.id || "";
                } catch(e) {}
            }

            // Check if there is an ongoing active exam for this session
            if (sessionID) {
                const activeStateRaw = localStorage.getItem(getActiveStateKey(sessionID));
                if (activeStateRaw) {
                    try {
                        const state = JSON.parse(activeStateRaw);
                        const elapsed = Math.floor((Date.now() - state.examStartTime) / 1000);
                        const remaining = state.totalTime - elapsed;

                        if (remaining > 0) {
                            // Resume exam seamlessly
                            candidateID = state.candidateID;
                            candidateDept = state.candidateDept;
                            questions = state.questions;
                            currentQ = state.currentQ || 0;
                            answers = state.answers || {};
                            timeLeft = remaining;
                            examStartTime = state.examStartTime;

                            startTimer();
                            renderExam();
                            return;
                        } else {
                            // Expired while away
                            candidateID = state.candidateID;
                            candidateDept = state.candidateDept;
                            questions = state.questions;
                            answers = state.answers || {};
                            timeLeft = 0;
                            clearActiveState();
                            submitQuiz();
                            return;
                        }
                    } catch(e) {}
                }
            }

            renderLogin();
            if (sessionID) {
                const idField = document.getElementById('cand-id');
                if (idField) {
                    idField.value = sessionID;
                    validateInput();
                }
            }
        }

        function validateInput() {
            const idInput = document.getElementById('cand-id').value.trim();
            const dInput = document.getElementById('cand-dept').value.trim();
            const btn = document.getElementById('start-btn');
            const errorMsg = document.getElementById('id-error');
            const isValidId = /^TLT260(59\d{2}|60\d{2}|6100)$/.test(idInput);
            
            if (idInput !== "" && !isValidId) errorMsg.classList.remove('opacity-0');
            else errorMsg.classList.add('opacity-0');

            if (isValidId && dInput) { 
                btn.disabled = false; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/50 transition-all active:scale-[0.98]"; 
            } else { 
                btn.disabled = true; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all"; 
            }
        }

        function startExam() {
            candidateID = document.getElementById('cand-id').value.trim().toUpperCase(); 
            candidateDept = document.getElementById('cand-dept').value.trim();
            localStorage.setItem('tlt_session', JSON.stringify({ id: candidateID, timestamp: Date.now() }));

            questions = rawQuestions.sort(() => Math.random() - 0.5).map(q => { 
                const opts = [q.c, ...q.i].sort(() => Math.random() - 0.5); 
                return { ...q, options: opts }; 
            });

            examStartTime = Date.now();
            timeLeft = TOTAL_TIME_SECONDS;
            saveActiveState();
            startTimer();
            renderExam();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
                timeLeft = TOTAL_TIME_SECONDS - elapsed;

                if (timeLeft > 0 && !isSubmitted) { 
                    const display = document.getElementById('timer-display');
                    if (display) { 
                        display.innerText = formatTime(timeLeft); 
                        if (timeLeft < 120) display.parentElement.classList.add('text-red-400', 'animate-pulse'); 
                    }
                } else if (timeLeft <= 0 && !isSubmitted) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function renderLogin() {
            const timeInMinutes = Math.floor(TOTAL_TIME_SECONDS / 60);
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-8 md:p-12">
                    <div class="w-16 h-16 bg-blue-900/50 text-blue-400 rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-blue-800/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-900/30 px-3 py-1 rounded border border-blue-800/30 mb-3">${EXAM_SUBJECT}</span>
                    <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-2">${EXAM_TOPIC}</h1>
                    <p class="text-slate-400 text-center mb-8 max-w-sm">Enter details to proceed. You have <strong>${timeInMinutes} minutes</strong>.</p>
                    <div class="w-full max-w-md space-y-4">
                        <div class="relative">${icons.user}<input type="text" id="cand-id" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all text-white placeholder:text-slate-600 font-mono uppercase" placeholder="ID (e.g. TLT2605900)"><p id="id-error" class="text-xs text-red-400 mt-1.5 font-medium ml-1 opacity-0 transition-opacity">Access Denied. ID not in registry.</p></div>
                        <div class="relative">${icons.book}<input type="text" id="cand-dept" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all text-white placeholder:text-slate-600" placeholder="Department / Course"></div>
                        <button id="start-btn" disabled onclick="startExam()" class="w-full py-3.5 mt-2 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all">Start Assessment</button>
                    </div>
                </div>`;
        }

        function renderExam() {
            const q = questions[currentQ]; 
            const hasAnsweredAll = Object.keys(answers).length === questions.length; 
            const progressPct = (Object.keys(answers).length / questions.length) * 100;
            
            let gridHTML = `<div class="flex gap-2 overflow-x-auto pb-3 custom-scroll mb-6">`;
            questions.forEach((_, idx) => {
                const isAns = answers[idx] !== undefined; 
                const isCurr = idx === currentQ;
                let btnClass = "min-w-[40px] h-10 rounded-lg font-medium text-sm flex items-center justify-center transition-all flex-shrink-0 cursor-pointer ";
                if (isCurr && isAns) btnClass += "bg-blue-600 text-white shadow-md shadow-blue-500/30";
                else if (isCurr) btnClass += "border-2 border-blue-500 text-blue-400 bg-blue-950/50";
                else if (isAns) btnClass += "bg-slate-800 text-slate-200 hover:bg-slate-700";
                else btnClass += "bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700 hover:text-slate-300";
                gridHTML += `<div onclick="jumpToQ(${idx})" class="${btnClass}">${idx + 1}</div>`;
            }); 
            gridHTML += `</div>`;

            let optionsHTML = `<div class="space-y-3 mt-6">`;
            q.options.forEach((opt, idx) => {
                const isSelected = answers[currentQ] === opt;
                optionsHTML += `<button onclick="selectOption(${idx})" class="option-btn w-full text-left p-4 rounded-xl border-2 ${isSelected ? 'border-blue-500 bg-blue-950/40' : 'border-slate-800 bg-slate-950/50 hover:border-slate-700 hover:bg-slate-900'}">
                    <div class="flex items-start gap-4"><div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mt-0.5 flex-shrink-0 ${isSelected ? 'border-blue-500 bg-blue-600' : 'border-slate-700'}">${isSelected ? '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>' : ''}</div><span class="text-slate-200 text-base leading-relaxed ${isSelected ? 'font-medium text-white' : ''}">${opt}</span></div></button>`;
            }); 
            optionsHTML += `</div>`;

            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center flex-wrap gap-4 border-b border-slate-800">
                    <div>
                        <span class="text-[11px] font-bold text-blue-400 uppercase tracking-widest">${EXAM_SUBJECT}</span>
                        <h2 class="text-sm font-bold text-slate-200">${EXAM_TOPIC}</h2>
                        <div class="text-xs mt-1 font-mono text-slate-400">${candidateID} <span class="text-slate-600 mx-1">•</span> <span class="font-sans">${candidateDept}</span></div>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800 font-mono text-lg font-bold text-blue-400 shadow-inner">${icons.clock}<span id="timer-display">${formatTime(Math.max(0, timeLeft))}</span></div>
                </div>
                <div class="h-1 w-full bg-slate-950"><div class="h-full bg-blue-500 transition-all duration-300" style="width: ${progressPct}%"></div></div>
                <div class="p-6 md:p-8 flex-1 flex flex-col">
                    ${gridHTML}
                    <div class="flex-1"><div class="flex items-start gap-4 mb-2"><span class="text-4xl font-black text-slate-700">${currentQ + 1}</span><h2 class="text-xl md:text-2xl font-semibold text-white leading-snug mt-1">${q.q}</h2></div>${optionsHTML}</div>
                    <div class="mt-10 flex justify-between items-center"><button onclick="changeQ(-1)" class="px-6 py-3 rounded-xl font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>${hasAnsweredAll || currentQ === questions.length - 1 ? `<button onclick="submitQuiz()" class="px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/30 transition-all active:scale-95">Submit Exam</button>` : `<button onclick="changeQ(1)" class="px-8 py-3 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-md active:scale-95">Next →</button>`}</div>
                </div>`;
        }

        async function submitQuiz() {
            isSubmitted = true; 
            clearInterval(timerInterval);
            clearActiveState();

            appDiv.innerHTML = `<div class="flex flex-col items-center justify-center h-full p-12"><div class="w-12 h-12 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-4"></div><p class="text-slate-400 font-medium animate-pulse">Calculating score & transmitting verification...</p></div>`;
            
            const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
            const timeSpentSeconds = Math.min(TOTAL_TIME_SECONDS, elapsed > 0 ? elapsed : TOTAL_TIME_SECONDS - timeLeft); 
            
            let score = 0;
            questions.forEach((q, index) => { if (answers[index] === q.c) score++; });
            const percentage = Math.round((score / questions.length) * 100); 
            let emailStatus = "";

            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const newRecord = { 
                examTitle: EXAM_TOPIC, 
                subject: EXAM_SUBJECT,
                score: score, 
                total: questions.length, 
                percent: percentage, 
                date: dateStr,
                time: timeStr
            };

            try {
                const storageKey = 'tlt_score_history_' + candidateID;
                const existingHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
                existingHistory.unshift(newRecord);
                if (existingHistory.length > 10) existingHistory.pop();
                localStorage.setItem(storageKey, JSON.stringify(existingHistory));
            } catch(e) {}

            if (WEB3FORMS_ACCESS_KEY) {
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
                        body: JSON.stringify({ 
                            access_key: WEB3FORMS_ACCESS_KEY, 
                            name: candidateID, 
                            email: "system@mockexam.com", 
                            subject: `Exam Result: ${candidateID} - ${percentage}% (${EXAM_TOPIC})`, 
                            from_name: "Mock Exam Portal", 
                            Subject: EXAM_SUBJECT,
                            Topic: EXAM_TOPIC, 
                            Candidate_ID: candidateID, 
                            Department: candidateDept, 
                            Score: `${score} out of ${questions.length} (${percentage}%)`, 
                            Time_Spent: formatTime(timeSpentSeconds) 
                        }) 
                    });
                    if (response.status === 200) { 
                        emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-950/60 text-green-400 text-sm font-semibold rounded-full border border-green-800/60">${icons.check} Result verified & logged</div>`; 
                    } else { throw new Error("Failed"); }
                } catch (e) { 
                    emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-red-950/60 text-red-400 text-sm font-semibold rounded-full border border-red-800/60">${icons.x} Verification offline. Saved locally.</div>`; 
                }
            } 
            renderResults(score, percentage, emailStatus, dateStr, timeStr);
        }

        function renderResults(score, percentage, emailStatus, dateStr, timeStr) {
            const strokeColor = percentage >= 70 ? '#22c55e' : percentage >= 50 ? '#f59e0b' : '#ef4444';
            let resultsHTML = `
                <div class="bg-slate-950 text-white p-6 md:p-8 text-center border-b border-slate-800">
                    <span class="inline-block text-[11px] font-bold tracking-widest uppercase bg-blue-900/40 text-blue-400 border border-blue-800/50 px-3 py-1 rounded mb-2">${EXAM_SUBJECT}</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${EXAM_TOPIC}</h1>
                    <div class="flex justify-center items-center gap-4 mt-3 pt-3 border-t border-slate-800/80 font-mono text-xs text-slate-400">
                        <span class="text-blue-400 font-bold">${candidateID}</span>
                        <span class="text-slate-600">•</span>
                        <span class="text-slate-300 font-sans">${candidateDept}</span>
                        <span class="text-slate-600">•</span>
                        <span>${dateStr} ${timeStr}</span>
                    </div>
                </div>

                <div class="p-6 md:p-8 text-center border-b border-slate-800">
                    <div class="relative w-40 h-40 mx-auto mb-2">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke="${strokeColor}" stroke-dasharray="${percentage}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="21" class="percentage">${percentage}%</text>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white mb-2">${score} / ${questions.length} Correct</h2>
                    <p class="text-xs text-slate-400 mb-6 uppercase tracking-wider font-semibold">${percentage >= 70 ? 'Distinction Standard' : percentage >= 50 ? 'Pass Standard' : 'Requires Revision'}</p>

                    <div class="flex justify-center">
                        <a href="index.html" class="inline-flex items-center justify-center px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-blue-900/30 active:scale-95">Return to Dashboard</a>
                    </div>
                    ${emailStatus}
                </div>

                <div class="p-6 md:p-10 bg-slate-950 flex-1">
                    <h3 class="text-lg font-bold text-white mb-6 flex items-center gap-2">Question Analysis</h3>
                    <div class="space-y-6">`;
            
            questions.forEach((q, index) => {
                const userAns = answers[index]; 
                const isCorrect = userAns === q.c;
                const icon = isCorrect ? `<div class="w-8 h-8 rounded-full bg-green-950 text-green-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-green-800">${icons.check}</div>` : `<div class="w-8 h-8 rounded-full bg-red-950 text-red-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-red-800">${icons.x}</div>`;
                resultsHTML += `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm flex gap-4">${icon}<div class="flex-1"><p class="font-semibold text-white text-base md:text-lg mb-4 leading-snug"><span class="text-slate-500 font-bold mr-2">${index + 1}.</span>${q.q}</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"><div class="bg-slate-950 p-3 rounded-lg border border-slate-800"><span class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Your Answer</span><span class="${isCorrect ? 'text-green-400' : 'text-red-400 line-through'} font-medium">${userAns || 'Not Answered'}</span></div>${!isCorrect ? `<div class="bg-green-950/40 p-3 rounded-lg border border-green-900/50"><span class="block text-xs font-bold text-green-500 uppercase tracking-wider mb-1">Correct Answer</span><span class="text-green-300 font-medium">${q.c}</span></div>` : ''}</div><div class="bg-blue-950/30 p-4 rounded-xl border border-blue-900/40"><span class="flex items-center gap-2 font-bold text-blue-400 text-xs uppercase tracking-wider mb-2">Rationale</span><p class="text-sm text-slate-300 leading-relaxed">${q.r}</p></div></div></div>`;
            }); 
            resultsHTML += `</div></div>`; 
            appDiv.innerHTML = resultsHTML;
        }

        function formatTime(seconds) { 
            const m = Math.floor(seconds / 60).toString().padStart(2, '0'); 
            const s = (seconds % 60).toString().padStart(2, '0'); 
            return `${m}:${s}`; 
        }
        window.selectOption = function(idx) { 
            if (isSubmitted) return; 
            answers[currentQ] = questions[currentQ].options[idx]; 
            saveActiveState();
            renderExam(); 
        }
        window.changeQ = function(delta) { 
            if (isSubmitted) return; 
            const newQ = currentQ + delta; 
            if (newQ >= 0 && newQ < questions.length) { 
                currentQ = newQ; 
                saveActiveState();
                renderExam(); 
            } 
        }
        window.jumpToQ = function(idx) { 
            if (isSubmitted) return; 
            currentQ = idx; 
            saveActiveState();
            renderExam(); 
        }
        initApp();
    </script>
</body>
</html>
