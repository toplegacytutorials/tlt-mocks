            if (candidateID) localStorage.removeItem(getActiveStateKey(candidateID));

            if (sessionID) {
                const activeStateRaw = localStorage.getItem(getActiveStateKey(sessionID));
                if (activeStateRaw) {
                    try {
                        const state = JSON.parse(activeStateRaw);

                        const remaining = state.totalTime - elapsed;

                        if (remaining > 0) {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;
                            questions = state.questions; currentQ = state.currentQ || 0;
                            answers = state.answers || {}; flagged = state.flagged || {};

                        } else {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;

            candidateID = document.getElementById('cand-id').value.trim().toUpperCase(); 
            candidateDept = document.getElementById('cand-dept').value.trim();
            localStorage.setItem('tlt_session', JSON.stringify({ id: candidateID, timestamp: Date.now() }));

            questions = rawQuestions.sort(() => Math.random() - 0.5).map(q => { 
                const opts = [q.c, ...q.i].sort(() => Math.random() - 0.5); 
                return { ...q, options: opts }; 
            });

            examStartTime = Date.now(); timeLeft = TOTAL_TIME_SECONDS;
            saveActiveState(); startTimer(); renderExam();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
                timeLeft = TOTAL_TIME_SECONDS - elapsed;

                if (timeLeft > 0 && !isSubmitted) { 
                    const display = document.getElementById('timer-display');
                    if (display) { 
                        display.innerText = formatTime(timeLeft); 
                        if (timeLeft < 300) display.parentElement.classList.add('text-red-400', 'animate-pulse'); 
                    }
                } else if (timeLeft <= 0 && !isSubmitted) {
                    clearInterval(timerInterval); submitQuiz();
                }
            }, 1000);
        }

        function renderLogin() {
            const timeInMinutes = Math.floor(TOTAL_TIME_SECONDS / 60);
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-8 md:p-12">
                    <div class="w-16 h-16 bg-blue-900/50 text-blue-400 rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-blue-800/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-900/30 px-3 py-1 rounded border border-emerald-800/30 mb-3">${EXAM_SUBJECT}</span>
                    <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-2">${EXAM_TOPIC}</h1>
                    <p class="text-slate-400 text-center mb-8 max-w-sm">Enter details to proceed. You have <strong>${timeInMinutes} minutes</strong> for <strong>${rawQuestions.length} questions</strong>.</p>
                    <div class="w-full max-w-md space-y-4">
                        <form onsubmit="event.preventDefault(); if(!document.getElementById('start-btn').disabled) startExam();" class="w-full">
                            <div class="relative mb-4">${icons.user}<input type="text" id="cand-id" name="tlt_exam_cand_id" autocomplete="username" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 outline-none transition-all text-white placeholder:text-slate-600 font-mono uppercase" placeholder="ID (e.g. TLT2605900)"><p id="id-error" class="text-xs text-red-400 mt-1.5 font-medium ml-1 opacity-0 transition-opacity">Access Denied. ID not in registry.</p></div>
                            <div class="relative">${icons.book}<input type="text" id="cand-dept" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 outline-none transition-all text-white placeholder:text-slate-600" placeholder="Department / Course"></div>
                            <button type="submit" id="start-btn" disabled class="w-full py-3.5 mt-6 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all">Start Assessment</button>
                        </form>
                    </div>
                </div>`;
        }

        function renderExam() {
            let savedScroll = 0;
            const existingGrid = document.getElementById('q-nav-grid');
            if (existingGrid) savedScroll = existingGrid.scrollLeft;

            const q = questions[currentQ]; 
            const hasAnsweredAll = Object.keys(answers).length === questions.length; 
            const progressPct = (Object.keys(answers).length / questions.length) * 100;
            const isFlagged = flagged[currentQ] || false;
            
            let gridHTML = `<div id="q-nav-grid" class="flex gap-2 overflow-x-auto pb-3 custom-scroll mb-6">`;
            questions.forEach((_, idx) => {
                const isAns = answers[idx] !== undefined; 
                const isCurr = idx === currentQ;
                const isF = flagged[idx];
                let btnClass = "min-w-[36px] h-9 rounded-lg font-medium text-xs flex items-center justify-center transition-all flex-shrink-0 cursor-pointer ";
                if (isCurr && isAns) btnClass += "bg-emerald-600 text-white shadow-md shadow-emerald-500/30";
                else if (isCurr) btnClass += "border-2 border-emerald-500 text-emerald-400 bg-emerald-950/50";
                else if (isF) btnClass += "bg-yellow-900/50 text-yellow-400 border border-yellow-700/50 hover:bg-yellow-900";
                else if (isAns) btnClass += "bg-slate-800 text-slate-200 hover:bg-slate-700";
                else btnClass += "bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700 hover:text-slate-300";
                gridHTML += `<div id="q-btn-${idx}" onclick="jumpToQ(${idx})" class="${btnClass}">${idx + 1}</div>`;
            }); 
            gridHTML += `</div>`;

            let optionsHTML = `<div class="space-y-3 mt-6">`;
            q.options.forEach((opt, idx) => {
                const isSelected = answers[currentQ] === opt;
                optionsHTML += `<button onclick="selectOption(${idx})" class="option-btn w-full text-left p-4 rounded-xl border-2 ${isSelected ? 'border-emerald-500 bg-emerald-950/40' : 'border-slate-800 bg-slate-950/50 hover:border-slate-700 hover:bg-slate-900'}">
                    <div class="flex items-start gap-4">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mt-0.5 flex-shrink-0 font-bold text-xs ${isSelected ? 'border-emerald-500 bg-emerald-600 text-white' : 'border-slate-700 text-slate-500'}">${optionLetters[idx]}</div>
                        <span class="text-slate-200 text-base leading-relaxed ${isSelected ? 'font-medium text-white' : ''}">${opt}</span>
                    </div>
                </button>`;
            }); 
            optionsHTML += `</div>`;

            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center flex-wrap gap-4 border-b border-slate-800">
                    <div class="flex-1 min-w-0">
                        <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-widest">${EXAM_SUBJECT}</span>
                        <h2 class="text-sm font-bold text-slate-200">${EXAM_TOPIC}</h2>
                        <div class="text-xs mt-1 font-mono text-slate-400 truncate">${candidateID} <span class="text-slate-600 mx-1">•</span> <span class="font-sans">${candidateDept}</span></div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                        <button onclick="toggleFlag()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${isFlagged ? 'bg-yellow-900/40 border-yellow-700/50 text-yellow-400' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'} transition-colors text-xs font-semibold">
                            ${isFlagged ? icons.flagSolid : icons.flag} ${isFlagged ? 'Flagged' : 'Flag for Review'}
                        </button>
                        <div class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800 font-mono text-lg font-bold text-emerald-400 shadow-inner">${icons.clock}<span id="timer-display">${formatTime(Math.max(0, timeLeft))}</span></div>
                    </div>
                </div>
                <div class="h-1 w-full bg-slate-950"><div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${progressPct}%"></div></div>
                <div class="p-6 md:p-8 flex-1 flex flex-col">
                    ${gridHTML}
                    <div class="flex-1"><div class="flex items-start gap-4 mb-2"><span class="text-4xl font-black text-slate-700">${currentQ + 1}</span><h2 class="text-xl md:text-2xl font-semibold text-white leading-snug mt-1">${q.q}</h2></div>${optionsHTML}</div>
                    <div class="mt-10 flex justify-between items-center"><button onclick="changeQ(-1)" class="px-6 py-3 rounded-xl font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>${hasAnsweredAll || currentQ === questions.length - 1 ? `<button onclick="submitQuiz()" class="px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/30 transition-all active:scale-95">Submit Exam</button>` : `<button onclick="changeQ(1)" class="px-8 py-3 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-500 transition-colors shadow-md active:scale-95">Next →</button>`}</div>
                </div>`;

            const newGrid = document.getElementById('q-nav-grid');
            if (newGrid) {
                newGrid.scrollLeft = savedScroll;
                const activeBtn = document.getElementById(`q-btn-${currentQ}`);
                if (activeBtn) {
                    const gridRect = newGrid.getBoundingClientRect();
                    const btnRect = activeBtn.getBoundingClientRect();
                    if (btnRect.left < gridRect.left || btnRect.right > gridRect.right) {
                        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }
            }
        }

        async function submitQuiz() {
            isSubmitted = true; clearInterval(timerInterval); clearActiveState();

            appDiv.innerHTML = `<div class="flex flex-col items-center justify-center h-full p-12"><div class="w-12 h-12 border-4 border-slate-800 border-t-emerald-500 rounded-full animate-spin mb-4"></div><p class="text-slate-400 font-medium animate-pulse">Calculating score & transmitting verification...</p></div>`;
            
            const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
            const timeSpentSeconds = Math.min(TOTAL_TIME_SECONDS, elapsed > 0 ? elapsed : TOTAL_TIME_SECONDS - timeLeft); 
            
            let score = 0;
            questions.forEach((q, index) => { if (answers[index] === q.c) score++; });
            const percentage = Math.round((score / questions.length) * 100); 
            let emailStatus = "";

            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const newRecord = { examTitle: EXAM_TOPIC, subject: EXAM_SUBJECT, score, total: questions.length, percent: percentage, date: dateStr, time: timeStr };

            try {
                const storageKey = 'tlt_score_history_' + candidateID;
                const existingHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
                existingHistory.unshift(newRecord);
                localStorage.setItem(storageKey, JSON.stringify(existingHistory));
            } catch(e) {}

            if (WEB3FORMS_ACCESS_KEY) {
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { 
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
                        body: JSON.stringify({ access_key: WEB3FORMS_ACCESS_KEY, name: candidateID, email: "system@mockexam.com", subject: `Exam Result: ${candidateID} - ${percentage}% (${EXAM_TOPIC})`, from_name: "Mock Exam Portal", Subject: EXAM_SUBJECT, Topic: EXAM_TOPIC, Candidate_ID: candidateID, Department: candidateDept, Score: `${score} out of ${questions.length} (${percentage}%)`, Time_Spent: formatTime(timeSpentSeconds) }) 
                    });
                    if (response.status === 200) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-950/60 text-green-400 text-sm font-semibold rounded-full border border-green-800/60">${icons.check} Result verified & logged</div>`; } else { throw new Error("Failed"); }
                } catch (e) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-red-950/60 text-red-400 text-sm font-semibold rounded-full border border-red-800/60">${icons.x} Verification offline. Saved locally.</div>`; }
            } 
            renderResults(score, percentage, emailStatus, dateStr, timeStr);
        }

        let currentResultFilter = 'all';

        function renderResults(score, percentage, emailStatus, dateStr, timeStr) {
            const strokeColor = percentage >= 70 ? '#22c55e' : percentage >= 50 ? '#f59e0b' : '#ef4444';
            
            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white p-6 md:p-8 text-center border-b border-slate-800">
                    <span class="inline-block text-[11px] font-bold tracking-widest uppercase bg-emerald-900/40 text-emerald-400 border border-emerald-800/50 px-3 py-1 rounded mb-2">${EXAM_SUBJECT}</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${EXAM_TOPIC}</h1>
                    <div class="flex justify-center items-center gap-4 mt-3 pt-3 border-t border-slate-800/80 font-mono text-xs text-slate-400">
                        <span class="text-emerald-400 font-bold">${candidateID}</span> <span class="text-slate-600">•</span> <span class="text-slate-300 font-sans">${candidateDept}</span> <span class="text-slate-600">•</span> <span>${dateStr} ${timeStr}</span>
                    </div>
                </div>

                <div class="p-6 md:p-8 text-center border-b border-slate-800">
                    <div class="relative w-40 h-40 mx-auto mb-2">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke="${strokeColor}" stroke-dasharray="${percentage}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="21" class="percentage">${percentage}%</text>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white mb-2">${score} / ${questions.length} Correct</h2>
                    <p class="text-xs text-slate-400 mb-6 uppercase tracking-wider font-semibold">${percentage >= 70 ? 'Distinction Standard' : percentage >= 50 ? 'Pass Standard' : 'Requires Revision'}</p>
                    <div class="flex justify-center">
                        <a href="index.html" class="inline-flex items-center justify-center px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-emerald-900/30 active:scale-95">Return to Dashboard</a>
                    </div>
                    ${emailStatus}
                </div>

                <div class="p-6 md:p-10 bg-slate-950 flex-1">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 class="text-lg font-bold text-white">Question Analysis</h3>
                        <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-800 overflow-x-auto custom-scroll w-full md:w-auto">
                            <button onclick="setResultFilter('all')" id="filter-btn-all" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white whitespace-nowrap">All</button>
                            <button onclick="setResultFilter('correct')" id="filter-btn-correct" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Correct</button>
                            <button onclick="setResultFilter('incorrect')" id="filter-btn-incorrect" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Incorrect</button>
                            <button onclick="setResultFilter('answered')" id="filter-btn-answered" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Answered</button>
                            <button onclick="setResultFilter('unanswered')" id="filter-btn-unanswered" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Unanswered</button>
                        </div>
                    </div>
                    <div id="results-container" class="space-y-6"></div>
                </div>
            `;
            currentResultFilter = 'all';
            renderResultQuestions();
        }

        function setResultFilter(filter) {
            currentResultFilter = filter;
            ['all', 'correct', 'incorrect', 'answered', 'unanswered'].forEach(f => {
                const btn = document.getElementById(`filter-btn-${f}`);
                if (f === filter) btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-emerald-600 text-white whitespace-nowrap";
                else btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap";
            });
            renderResultQuestions();
        }

        function renderResultQuestions() {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            let count = 0;

            questions.forEach((q, index) => {
                const userAns = answers[index]; 
                const isCorrect = userAns === q.c;
                const isAnswered = userAns !== undefined;
                
                if (currentResultFilter === 'correct' && !isCorrect) return;
                if (currentResultFilter === 'incorrect' && (isCorrect || !isAnswered)) return;
                if (currentResultFilter === 'answered' && !isAnswered) return;
                if (currentResultFilter === 'unanswered' && isAnswered) return;

                count++;
                const icon = isCorrect ? `<div class="w-8 h-8 rounded-full bg-green-950 text-green-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-green-800">${icons.check}</div>` : `<div class="w-8 h-8 rounded-full bg-red-950 text-red-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-red-800">${icons.x}</div>`;
                
                container.innerHTML += `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm flex gap-4">${icon}<div class="flex-1"><p class="font-semibold text-white text-base md:text-lg mb-4 leading-snug"><span class="text-slate-500 font-bold mr-2">${index + 1}.</span>${q.q}</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"><div class="bg-slate-950 p-3 rounded-lg border border-slate-800"><span class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Your Answer</span><span class="${isCorrect ? 'text-green-400' : 'text-red-400 line-through'} font-medium">${userAns || 'Not Answered'}</span></div>${!isCorrect ? `<div class="bg-green-950/40 p-3 rounded-lg border border-green-900/50"><span class="block text-xs font-bold text-green-500 uppercase tracking-wider mb-1">Correct Answer</span><span class="text-green-300 font-medium">${q.c}</span></div>` : ''}</div><div class="bg-emerald-950/30 p-4 rounded-xl border border-emerald-900/40"><span class="flex items-center gap-2 font-bold text-emerald-400 text-xs uppercase tracking-wider mb-2">Rationale</span><p class="text-sm text-slate-300 leading-relaxed">${q.r}</p></div></div></div>`;
            });

            if (count === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">No questions match this filter.</p>`;
            }
        }

        function formatTime(seconds) { 
            const m = Math.floor(seconds / 60).toString().padStart(2, '0'); 
            const s = (seconds % 60).toString().padStart(2, '0'); 
            return `${m}:${s}`; 
        }

        window.selectOption = function(idx) { 
            if (isSubmitted) return; 
            answers[currentQ] = questions[currentQ].options[idx]; 
            saveActiveState(); renderExam(); 
        }
        window.changeQ = function(delta) { 
            if (isSubmitted) return; 
            const newQ = currentQ + delta; 
            if (newQ >= 0 && newQ < questions.length) { 
                currentQ = newQ; saveActiveState(); renderExam(); 
            } 
        }
        window.jumpToQ = function(idx) { 
            if (isSubmitted) return; 
            currentQ = idx; saveActiveState(); renderExam(); 
        }
        window.toggleFlag = function() {
            if (isSubmitted) return;
            flagged[currentQ] = !flagged[currentQ];
            saveActiveState(); renderExam();
        }

        initApp();
    </script>
</body>
</html>
