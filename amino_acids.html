        function getActiveStateKey(id) { return `tlt_active_exam_${EXAM_KEY}_${id}`; }

        function saveActiveState() {
            if (!candidateID || isSubmitted) return;
            const state = { candidateID, candidateDept, questions, currentQ, answers, flagged, examStartTime, totalTime: TOTAL_TIME_SECONDS };
            localStorage.setItem(getActiveStateKey(candidateID), JSON.stringify(state));
        }

        function clearActiveState() {
            if (candidateID) localStorage.removeItem(getActiveStateKey(candidateID));
        }

        function initApp() {
            const rawSession = localStorage.getItem('tlt_session');
            let sessionID = "";
            if (rawSession) { try { sessionID = JSON.parse(rawSession).id || ""; } catch(e) {} }

            if (sessionID) {
                const activeStateRaw = localStorage.getItem(getActiveStateKey(sessionID));
                if (activeStateRaw) {
                    try {
                        const state = JSON.parse(activeStateRaw);
                        const elapsed = Math.floor((Date.now() - state.examStartTime) / 1000);
                        const remaining = state.totalTime - elapsed;

                        if (remaining > 0) {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;
                            questions = state.questions; currentQ = state.currentQ || 0;
                            answers = state.answers || {}; flagged = state.flagged || {};
                            timeLeft = remaining; examStartTime = state.examStartTime;
                            startTimer(); renderExam(); return;
                        } else {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;
                            questions = state.questions; answers = state.answers || {}; 
                            flagged = state.flagged || {}; timeLeft = 0;
                            clearActiveState(); submitQuiz(); return;
                        }
                    } catch(e) {}
                }
            }

            renderLogin();
            if (sessionID) {
                const idField = document.getElementById('cand-id');
                if (idField) { idField.value = sessionID; validateInput(); }
            }
        }

        function validateInput() {
            const idInput = document.getElementById('cand-id').value.trim().toUpperCase();
            const dInput = document.getElementById('cand-dept').value.trim();
            const btn = document.getElementById('start-btn');
            const errorMsg = document.getElementById('id-error');
            const isValidId = /^TLT260(59\d{2}|60\d{2}|6100)$/.test(idInput);
            
            if (idInput !== "" && !isValidId) errorMsg.classList.remove('opacity-0');
            else errorMsg.classList.add('opacity-0');

            if (isValidId && dInput) { 
                btn.disabled = false; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/50 transition-all active:scale-[0.98]"; 
            } else { 
                btn.disabled = true; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all"; 
            }
        }

        function startExam() {
            candidateID = document.getElementById('cand-id').value.trim().toUpperCase(); 
            candidateDept = document.getElementById('cand-dept').value.trim();
            localStorage.setItem('tlt_session', JSON.stringify({ id: candidateID, timestamp: Date.now() }));

            // No need to shuffle options since they are fixed A-E statements
            questions = [...rawQuestions]; 

            examStartTime = Date.now(); timeLeft = TOTAL_TIME_SECONDS;
            saveActiveState(); startTimer(); renderExam();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
                timeLeft = TOTAL_TIME_SECONDS - elapsed;

                if (timeLeft > 0 && !isSubmitted) { 
                    const display = document.getElementById('timer-display');
                    if (display) { 
                        display.innerText = formatTime(timeLeft); 
                        if (timeLeft < 300) display.parentElement.classList.add('text-red-400', 'animate-pulse'); 
                    }
                } else if (timeLeft <= 0 && !isSubmitted) {
                    clearInterval(timerInterval); submitQuiz();
                }
            }, 1000);
        }

        function renderLogin() {
            const timeInMinutes = Math.floor(TOTAL_TIME_SECONDS / 60);
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-8 md:p-12">
                    <div class="w-16 h-16 bg-blue-900/50 text-blue-400 rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-blue-800/50">

                    </div>

                    <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-2">${EXAM_TOPIC}</h1>
                    <p class="text-slate-400 text-center mb-8 max-w-sm">Enter details to proceed. You have <strong>${timeInMinutes} minutes</strong> for <strong>${rawQuestions.length} questions (5 statements each)</strong>. <br><span class="text-red-400 font-bold mt-2 inline-block">NOTE: Negative marking applies (-0.25 for incorrect statements).</span></p>
                    <div class="w-full max-w-md space-y-4">

        function renderExam() {
            let savedScroll = 0;
            const existingGrid = document.getElementById('q-nav-grid');
            if (existingGrid) savedScroll = existingGrid.scrollLeft;

            const q = questions[currentQ]; 
            
            // Count total statements answered for progress bar
            let answeredStatements = 0;
            Object.values(answers).forEach(ansArr => {
                ansArr.forEach(val => { if (val !== null && val !== undefined) answeredStatements++; });
            });
            const totalStatements = questions.length * 5;
            const progressPct = (answeredStatements / totalStatements) * 100;

            const isFlagged = flagged[currentQ] || false;
            
            let gridHTML = `<div id="q-nav-grid" class="flex gap-2 overflow-x-auto pb-3 custom-scroll mb-6">`;
            questions.forEach((_, idx) => {
                const hasAns = answers[idx] && answers[idx].some(v => v !== null);
                const isCurr = idx === currentQ;
                const isF = flagged[idx];
                let btnClass = "min-w-[36px] h-9 rounded-lg font-medium text-xs flex items-center justify-center transition-all flex-shrink-0 cursor-pointer ";
                if (isCurr && hasAns) btnClass += "bg-blue-600 text-white shadow-md shadow-blue-500/30";
                else if (isCurr) btnClass += "border-2 border-blue-500 text-blue-400 bg-blue-950/50";
                else if (isF) btnClass += "bg-yellow-900/50 text-yellow-400 border border-yellow-700/50 hover:bg-yellow-900";
                else if (hasAns) btnClass += "bg-slate-800 text-slate-200 hover:bg-slate-700";
                else btnClass += "bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700 hover:text-slate-300";
                gridHTML += `<div id="q-btn-${idx}" onclick="jumpToQ(${idx})" class="${btnClass}">${idx + 1}</div>`;
            }); 
            gridHTML += `</div>`;

            let statementsHTML = `<div class="space-y-4 mt-6">`;
            q.statements.forEach((stmt, idx) => {
                const userAns = answers[currentQ] ? answers[currentQ][idx] : null;
                const isTrue = userAns === true;
                const isFalse = userAns === false;
                const letter = String.fromCharCode(65 + idx); // A, B, C, D, E

                statementsHTML += `
                <div class="flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl border-2 transition-all ${isTrue ? 'border-green-500 bg-green-950/20' : isFalse ? 'border-red-500 bg-red-950/20' : 'border-slate-800 bg-slate-950/50'}">
                    <div class="flex-1 flex items-start gap-3">
                        <span class="font-bold text-slate-500 mt-0.5">${letter}.</span>
                        <span class="text-slate-200 text-base leading-relaxed">${stmt.text}</span>
                    </div>
                    <div class="flex gap-2 shrink-0 md:ml-4">
                        <button onclick="selectTF(${idx}, true)" class="px-6 py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider ${isTrue ? 'bg-green-600 text-white shadow-lg shadow-green-900/50 scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'} transition-all active:scale-95">True</button>
                        <button onclick="selectTF(${idx}, false)" class="px-6 py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider ${isFalse ? 'bg-red-600 text-white shadow-lg shadow-red-900/50 scale-105' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'} transition-all active:scale-95">False</button>
                    </div>
                </div>`;
            }); 
            statementsHTML += `</div>`;

            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center flex-wrap gap-4 border-b border-slate-800">
                    <div class="flex-1 min-w-0">
                        <span class="text-[11px] font-bold text-blue-400 uppercase tracking-widest">${EXAM_SUBJECT}</span>
                        <h2 class="text-sm font-bold text-slate-200">${EXAM_TOPIC}</h2>
                        <div class="text-xs mt-1 font-mono text-slate-400 truncate">${candidateID} <span class="text-slate-600 mx-1">•</span> <span class="font-sans">${candidateDept}</span></div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                        <button onclick="toggleFlag()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${isFlagged ? 'bg-yellow-900/40 border-yellow-700/50 text-yellow-400' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'} transition-colors text-xs font-semibold">
                            ${isFlagged ? icons.flagSolid : icons.flag} ${isFlagged ? 'Flagged' : 'Flag for Review'}
                        </button>
                        <div class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800 font-mono text-lg font-bold text-blue-400 shadow-inner">${icons.clock}<span id="timer-display">${formatTime(Math.max(0, timeLeft))}</span></div>
                    </div>
                </div>
                <div class="h-1 w-full bg-slate-950"><div class="h-full bg-blue-500 transition-all duration-300" style="width: ${progressPct}%"></div></div>
                <div class="p-6 md:p-8 flex-1 flex flex-col">
                    ${gridHTML}
                    <div class="flex-1">
                        <div class="flex items-start gap-4 mb-2">
                            <span class="text-4xl font-black text-slate-700">${currentQ + 1}</span>
                            <h2 class="text-lg md:text-xl font-semibold text-white leading-snug mt-1">${q.q}</h2>
                        </div>
                        ${statementsHTML}
                    </div>
                    <div class="mt-10 flex justify-between items-center">
                        <button onclick="changeQ(-1)" class="px-6 py-3 rounded-xl font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>
                        ${currentQ === questions.length - 1 ? `<button onclick="submitQuiz()" class="px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/30 transition-all active:scale-95">Submit Exam</button>` : `<button onclick="changeQ(1)" class="px-8 py-3 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-md active:scale-95">Next →</button>`}
                    </div>
                </div>`;

            const newGrid = document.getElementById('q-nav-grid');
            if (newGrid) {
                newGrid.scrollLeft = savedScroll;
                const activeBtn = document.getElementById(`q-btn-${currentQ}`);
                if (activeBtn) {
                    const gridRect = newGrid.getBoundingClientRect();
                    const btnRect = activeBtn.getBoundingClientRect();
                    if (btnRect.left < gridRect.left || btnRect.right > gridRect.right) {
                        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }
            }
        }

        async function submitQuiz() {
            isSubmitted = true; clearInterval(timerInterval); clearActiveState();

            appDiv.innerHTML = `<div class="flex flex-col items-center justify-center h-full p-12"><div class="w-12 h-12 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-4"></div><p class="text-slate-400 font-medium animate-pulse">Calculating score & applying negative marking...</p></div>`;
            
            const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
            const timeSpentSeconds = Math.min(TOTAL_TIME_SECONDS, elapsed > 0 ? elapsed : TOTAL_TIME_SECONDS - timeLeft); 
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;

            questions.forEach((q, index) => {
                const userAns = answers[index] || [];
                q.statements.forEach((stmt, sIdx) => {
                    const ans = userAns[sIdx];
                    if (ans === null || ans === undefined) {
                        unattemptedCount++;
                    } else if (ans === stmt.correct) {
                        score += 1;
                        correctCount++;
                    } else {
                        score -= 0.25;
                        incorrectCount++;
                    }
                });
            });

            const maxScore = questions.length * 5;
            const percentage = Math.max(0, (score / maxScore) * 100);
            
            let emailStatus = "";
            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const newRecord = { examTitle: EXAM_TOPIC, subject: EXAM_SUBJECT, score: score.toFixed(2), total: maxScore, percent: Math.round(percentage), date: dateStr, time: timeStr };

            try {
                const storageKey = 'tlt_score_history_' + candidateID;
                const existingHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
                existingHistory.unshift(newRecord);
                localStorage.setItem(storageKey, JSON.stringify(existingHistory));
            } catch(e) {}

            if (WEB3FORMS_ACCESS_KEY) {
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { 
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
                        body: JSON.stringify({ 
                            access_key: WEB3FORMS_ACCESS_KEY, 
                            name: candidateID, email: "system@mockexam.com", 
                            subject: `Exam Result: ${candidateID} - ${Math.round(percentage)}% (${EXAM_TOPIC})`, 
                            from_name: "Mock Exam Portal", 
                            Subject: EXAM_SUBJECT, Topic: EXAM_TOPIC, Candidate_ID: candidateID, 
                            Department: candidateDept, 
                            Raw_Score: `${score} out of ${maxScore}`, 
                            Percentage: `${Math.round(percentage)}%`,
                            Negative_Marking: "Yes (-0.25 per incorrect statement)",
                            Time_Spent: formatTime(timeSpentSeconds) 
                        }) 
                    });
                    if (response.status === 200) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-950/60 text-green-400 text-sm font-semibold rounded-full border border-green-800/60">${icons.check} Result verified & logged</div>`; } else { throw new Error("Failed"); }
                } catch (e) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-red-950/60 text-red-400 text-sm font-semibold rounded-full border border-red-800/60">${icons.x} Verification offline. Saved locally.</div>`; }
            } 
            renderResults(score, percentage, correctCount, incorrectCount, unattemptedCount, emailStatus, dateStr, timeStr);
        }

        let currentResultFilter = 'all';

        function renderResults(score, percentage, correctCount, incorrectCount, unattemptedCount, emailStatus, dateStr, timeStr) {
            const displayPercent = Math.round(percentage);
            const strokeColor = displayPercent >= 70 ? '#22c55e' : displayPercent >= 50 ? '#f59e0b' : '#ef4444';
            
            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white p-6 md:p-8 text-center border-b border-slate-800">
                    <span class="inline-block text-[11px] font-bold tracking-widest uppercase bg-blue-900/40 text-blue-400 border border-blue-800/50 px-3 py-1 rounded mb-2">${EXAM_SUBJECT}</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${EXAM_TOPIC}</h1>
                    <div class="flex justify-center items-center gap-4 mt-3 pt-3 border-t border-slate-800/80 font-mono text-xs text-slate-400">
                        <span class="text-blue-400 font-bold">${candidateID}</span> <span class="text-slate-600">•</span> <span class="text-slate-300 font-sans">${candidateDept}</span> <span class="text-slate-600">•</span> <span>${dateStr} ${timeStr}</span>
                    </div>
                </div>

                <div class="p-6 md:p-8 text-center border-b border-slate-800">
                    <div class="relative w-40 h-40 mx-auto mb-2">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke="${strokeColor}" stroke-dasharray="${displayPercent}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="21" class="percentage">${displayPercent}%</text>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white mb-1">${score.toFixed(2)} / ${questions.length * 5} Marks</h2>
                    <p class="text-xs text-slate-400 mb-4 uppercase tracking-wider font-semibold">${displayPercent >= 70 ? 'Distinction Standard' : displayPercent >= 50 ? 'Pass Standard' : 'Requires Revision'}</p>
                    
                    <div class="inline-block bg-red-950/30 border border-red-900/50 rounded-lg px-4 py-2 mb-6">
                        <span class="text-xs font-bold text-red-400 uppercase tracking-widest block mb-1">Negative Marking Applied (-0.25)</span>
                        <div class="flex justify-center gap-4 text-xs font-mono">
                            <span class="text-green-400">✓ ${correctCount} Correct</span>
                            <span class="text-red-400">✗ ${incorrectCount} Incorrect</span>
                            <span class="text-slate-400">- ${unattemptedCount} Unattempted</span>
                        </div>
                    </div>

                    <div class="flex justify-center mt-2">
                        <a href="index.html" class="inline-flex items-center justify-center px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-blue-900/30 active:scale-95">Return to Dashboard</a>
                    </div>
                    ${emailStatus}
                </div>

                <div class="p-6 md:p-10 bg-slate-950 flex-1">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 class="text-lg font-bold text-white">Detailed Question Analysis</h3>
                        <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-800 overflow-x-auto custom-scroll w-full md:w-auto">
                            <button onclick="setResultFilter('all')" id="filter-btn-all" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white whitespace-nowrap">All</button>
                            <button onclick="setResultFilter('correct')" id="filter-btn-correct" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Fully Correct</button>
                            <button onclick="setResultFilter('incorrect')" id="filter-btn-incorrect" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Has Errors</button>
                        </div>
                    </div>
                    <div id="results-container" class="space-y-6"></div>
                </div>
            `;
            currentResultFilter = 'all';
            renderResultQuestions();
        }

        function setResultFilter(filter) {
            currentResultFilter = filter;
            ['all', 'correct', 'incorrect'].forEach(f => {
                const btn = document.getElementById(`filter-btn-${f}`);
                if (f === filter) btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white whitespace-nowrap";
                else btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap";
            });
            renderResultQuestions();
        }

        function renderResultQuestions() {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            let count = 0;

            questions.forEach((q, index) => {
                const userAns = answers[index] || [];
                let qCorrect = 0;
                let qIncorrect = 0;
                let qUnattempted = 0;

                const stmtHTML = q.statements.map((stmt, sIdx) => {
                    const uAns = userAns[sIdx];
                    const isCorrect = uAns === stmt.correct;
                    const isAnswered = uAns !== null && uAns !== undefined;
                    const letter = String.fromCharCode(65 + sIdx);

                    if (!isAnswered) qUnattempted++;
                    else if (isCorrect) qCorrect++;
                    else qIncorrect++;

                    let statusIcon = '';
                    let bgClass = '';
                    if (!isAnswered) {
                        statusIcon = `<span class="text-xs font-bold text-slate-500">Skipped</span>`;
                        bgClass = 'bg-slate-900/50 border-slate-800';
                    } else if (isCorrect) {
                        statusIcon = `<span class="text-xs font-bold text-green-400">+1</span>`;
                        bgClass = 'bg-slate-950 border-green-900/30';
                    } else {
                        statusIcon = `<span class="text-xs font-bold text-red-400">-0.25</span>`;
                        bgClass = 'bg-slate-950 border-red-900/30';
                    }

                    return `
                        <div class="flex items-start gap-3 p-3 rounded-lg border ${bgClass}">
                            <span class="font-bold text-slate-500 mt-0.5">${letter}.</span>
                            <div class="flex-1">
                                <span class="text-sm text-slate-300 block mb-1">${stmt.text}</span>
                                <div class="flex gap-4 text-[11px] font-mono">
                                    <span class="${isAnswered ? (isCorrect ? 'text-green-400' : 'text-red-400') : 'text-slate-500'}">Your Answer: ${isAnswered ? (uAns ? 'True' : 'False') : 'None'}</span>
                                    <span class="text-green-400">Correct: ${stmt.correct ? 'True' : 'False'}</span>
                                </div>
                            </div>
                            <div class="shrink-0 mt-1">${statusIcon}</div>
                        </div>
                    `;
                }).join('');

                // Filtering Logic
                const isFullyCorrect = qIncorrect === 0 && qUnattempted === 0;
                if (currentResultFilter === 'correct' && !isFullyCorrect) return;
                if (currentResultFilter === 'incorrect' && isFullyCorrect) return;

                count++;
                
                container.innerHTML += `
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm">
                        <p class="font-semibold text-white text-base md:text-lg mb-4 leading-snug">
                            <span class="text-slate-500 font-bold mr-2">${index + 1}.</span>${q.q}
                        </p>
                        <div class="space-y-3 mb-6">${stmtHTML}</div>
                        <div class="bg-blue-950/30 p-4 rounded-xl border border-blue-900/40">
                            <span class="flex items-center gap-2 font-bold text-blue-400 text-xs uppercase tracking-wider mb-2">Rationale</span>
                            <p class="text-sm text-slate-300 leading-relaxed">${q.r}</p>
                        </div>
                    </div>
                `;
            });

            if (count === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">No questions match this filter.</p>`;
            }
        }

        function formatTime(seconds) { 
            const m = Math.floor(seconds / 60).toString().padStart(2, '0'); 
            const s = (seconds % 60).toString().padStart(2, '0'); 
            return `${m}:${s}`; 
        }

        window.selectTF = function(stmtIdx, val) { 
            if (isSubmitted) return; 
            if (!answers[currentQ]) answers[currentQ] = Array(5).fill(null);
            answers[currentQ][stmtIdx] = val;
            saveActiveState(); 
            renderExam(); 
        }
        
        window.changeQ = function(delta) { 
            if (isSubmitted) return; 
            const newQ = currentQ + delta; 
            if (newQ >= 0 && newQ < questions.length) { 
                currentQ = newQ; saveActiveState(); renderExam(); 
            } 
        }
        
        window.jumpToQ = function(idx) { 
            if (isSubmitted) return; 
            currentQ = idx; saveActiveState(); renderExam(); 
        }
        
        window.toggleFlag = function() {
            if (isSubmitted) return;
            flagged[currentQ] = !flagged[currentQ];
            saveActiveState(); renderExam();
        }

        initApp();
    </script>
</body>
</html>
