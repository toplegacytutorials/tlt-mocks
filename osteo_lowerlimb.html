<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-4xl bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden min-h-[600px] flex flex-col relative">
        <!-- Assessment Injected Here -->
    </div>

    <script>
        const EXAM_KEY = "osteo_lowerlimb";
        const EXAM_SUBJECT = "Anatomy";
        const EXAM_TOPIC = "ANATOMY - OSTEOLOGY OF THE LOWER LIMB";
        const TOTAL_TIME_SECONDS = 1800; // 30 minutes
        const WEB3FORMS_ACCESS_KEY = "a9cd9997-29c3-486f-9667-bb01dfdb0375";

        const rawQuestions = [
            // UNIBEN-STYLE & CLINICAL VIGNETTES (30 Questions)
            { q: "A patient presents with a fracture of the femoral neck. What is the most likely severe complication due to the disruption of blood supply?", c: "Avascular necrosis of the head", i: ["Osteomyelitis of the shaft", "Dislocation of the patella", "Ischemia of the foot", "Fracture of the fibula"], r: "Fracture of the neck of the femur is common in the elderly and may compromise blood supply, leading to avascular necrosis of the head." },
            { q: "During a pelvic examination, a clinician notes a wider greater sciatic notch (~90°) and an everted ischial spine. These findings are characteristic of:", c: "Female hip bone", i: ["Male hip bone", "Fetal hip bone", "Osteoporotic hip bone", "Fractured hip bone"], r: "Female greater sciatic notch: Wider (~90°). Female ischial spine: Not inverted (Everted)." },
            { q: "A male patient undergoes a pelvic CT scan. Which of the following features is expected to be observed?", c: "Oval obturator foramen", i: ["Triangular obturator foramen", "Thin ischiopubic ramus", "Shallower iliac fossa", "More conspicuous pre-auricular sulcus"], r: "Male obturator foramen: Oval. Female: Triangular. Male ischiopubic ramus is thick. Male iliac fossa is deeper. Male pre-auricular sulcus is shallow." },
            { q: "A clinician is assessing an infant's skeletal development. The lower end of the femur has a secondary ossification center present. This indicates the infant is approximately:", c: "At birth (9th month of IUL)", i: ["1st year old", "4 years old", "7th week of IUL", "12 years old"], r: "Lower end of femur secondary center appears at the 9th month of IUL (at birth)." },
            { q: "A patient suffers a fracture to the prominent lateral bone of the leg that is frequently used for bone grafts. Which specific part of this bone is most commonly harvested?", c: "Middle 1/3", i: ["Upper 1/3", "Lower 1/3", "Lateral malleolus", "Fibular head"], r: "The middle 1/3 of the fibula is often used for bone grafts." },
            { q: "A patient is diagnosed with a fracture of the tuberosity of the 5th metatarsal. This is known as:", c: "Jones fracture", i: ["March fracture", "Pott's fracture", "Colles' fracture", "Smith's fracture"], r: "Jones fracture is a fracture of the 5th metatarsal tuberosity (styloid process)." },
            { q: "A soldier complains of foot pain after a long march. Imaging reveals a stress fracture of the 2nd metatarsal shaft. This is known as:", c: "March fracture", i: ["Jones fracture", "Pott's fracture", "Maisonneuve fracture", "Lisfranc fracture"], r: "March fracture is a stress fracture of the 2nd or 3rd metatarsal shaft." },
            { q: "A patient dislocates their kneecap. Which direction is this dislocation most likely to occur based on anatomical predispositions?", c: "Lateral", i: ["Medial", "Anterior", "Posterior", "Superior"], r: "Dislocation of the patella is usually lateral." },
            { q: "An X-ray of a child's knee shows a patella divided into two separate bones. This congenital anomaly, which can be mistaken for a fracture, is called:", c: "Bipartite patella", i: ["Patella alta", "Patella baja", "Bifid patella", "Osteochondritis dissecans"], r: "Bipartite patella is a failure of fusion of ossification centers; a congenital condition where the kneecap is composed of two separate bones." },
            { q: "A fracture occurs in the most commonly fractured long bone of the body, and due to its high vascularity, the upper end is susceptible to osteomyelitis. Which bone is this?", c: "Tibia", i: ["Femur", "Fibula", "Humerus", "Radius"], r: "The tibia is the most commonly fractured long bone. Osteomyelitis is common at the upper end due to high vascularity." },
            { q: "Why does the fibula violate the 'law of union' of epiphyses?", c: "Its lower end is a pressure epiphysis that unites first", i: ["Its upper end is a pressure epiphysis that unites first", "It does not have a secondary ossification center", "It fuses completely in the 7th week of IUL", "It has three primary ossification centers"], r: "The lower end is a pressure epiphysis (appears first in the 1st year and unites first at 16 years), whereas its upper end is a traction epiphysis." },
            { q: "During an anatomical dissection, a student finds a large opening in the hip bone that is closed by a membrane except superiorly. What passes through this superior gap?", c: "Obturator nerve and vessels", i: ["Femoral nerve and vessels", "Sciatic nerve", "Pudendal nerve", "Superior gluteal nerve"], r: "Obturator Foramen is closed by the obturator membrane, except at the obturator canal superiorly (for the obturator nerve/vessels)." },
            { q: "In the anatomical position, which two bony landmarks of the hip bone lie in the same coronal plane?", c: "Pubic tubercle and anterior superior iliac spine (ASIS)", i: ["Ischial tuberosity and ASIS", "Pubic symphysis and ischial spine", "Acetabulum and obturator foramen", "Iliac crest and pubic crest"], r: "The pubic tubercle and anterior superior iliac spine (ASIS) lie in the same coronal plane." },
            { q: "A patient requires a bone marrow biopsy. The preferred site is the large, weight-bearing prominence of the ischium. What is this feature called?", c: "Ischial tuberosity", i: ["Ischial spine", "Iliac crest", "Greater trochanter", "Lesser trochanter"], r: "The large Ischial Tuberosity is weight-bearing when sitting." },
            { q: "Which of the following features is part of the medial bone of the leg and forms the medial prominence of the ankle?", c: "Medial malleolus", i: ["Lateral malleolus", "Styloid process", "Soleal line", "Intercondylar area"], r: "The lower end of the tibia forms the Medial Malleolus (medial ankle prominence)." },
            { q: "A patient is unable to bear weight comfortably. The primary weight-bearing bone of the leg is the:", c: "Tibia", i: ["Fibula", "Femur", "Calcaneus", "Talus"], r: "The tibia is the medial, larger, and primary weight-bearing bone of the leg. The fibula is non-weight bearing." },
            { q: "During a knee examination, a clinician palpates a large sesamoid bone embedded in the quadriceps tendon. What attaches to the inferior apex of this bone?", c: "Ligamentum patellae", i: ["Quadriceps tendon", "Medial collateral ligament", "Lateral collateral ligament", "Cruciate ligament"], r: "The apex of the patella (inferiorly) attaches to the ligamentum patellae." },
            { q: "Which structure separates the greater and lesser sciatic notches of the hip bone?", c: "Ischial spine", i: ["Ischial tuberosity", "Posterior inferior iliac spine", "Acetabulum", "Obturator crest"], r: "The Ischial Spine separates the greater and lesser sciatic notches." },
            { q: "A patient suffers a Pott's fracture. This injury typically involves a fracture of the:", c: "Lower end of the fibula", i: ["Shaft of the tibia", "Neck of the femur", "5th metatarsal base", "Calcaneus"], r: "Fractures at the lower end of the fibula are common (e.g., Pott's fracture)." },
            { q: "A patient has a prominent, palpable bony ridge on the anterior aspect of the leg, just beneath the skin. What is this border called?", c: "Anterior border (Shin)", i: ["Posterior border", "Interosseous border", "Medial border", "Soleal line"], r: "The anterior border of the tibia is sharp and subcutaneous, commonly called the shin." },
            { q: "A child presents with a fracture in the upper third of the femur. Which secondary ossification center is most likely active in this region at this age?", c: "Greater trochanter", i: ["Head", "Lower end", "Lesser trochanter", "Shaft"], r: "The Greater trochanter secondary center appears at 4 years. The Lesser trochanter appears at 12 years. The Head appears at 1 year." },
            { q: "Which metatarsal is considered the 'key to the arch' because it is the longest and most fixed?", c: "2nd metatarsal", i: ["1st metatarsal", "3rd metatarsal", "4th metatarsal", "5th metatarsal"], r: "The 2nd metatarsal is the longest and most fixed (key to the arch)." },
            { q: "A clinician is differentiating between metatarsals and metacarpals. Which of the following statements correctly describes a feature unique to the metatarsals?", c: "Their concavity faces downward (Plantar)", i: ["Their concavity faces forward (Palmar)", "Their shafts thicken from base to head", "Their heads are larger or equal to their bases", "They have distal triangular flattening"], r: "Metatarsal concavity faces downward (Plantar). Metacarpal concavity faces forward (Palmar)." },
            { q: "A patient reports a deep pain in the heel of the foot. Which of the following is the largest tarsal bone forming the heel?", c: "Calcaneus", i: ["Talus", "Navicular", "Cuboid", "Lateral Cuneiform"], r: "The Calcaneus is the heel bone and the largest tarsal bone." },
            { q: "During a surgical procedure, a bone with zero muscle attachments is identified. Which tarsal bone is this?", c: "Talus", i: ["Calcaneus", "Navicular", "Cuboid", "Medial Cuneiform"], r: "The Talus articulates with the tibia/fibula and has no muscle attachments." },
            { q: "A young athlete suffers a twisting injury to the knee. Radiographs show an avulsion fracture at the tibial tuberosity. This indicates a forceful pull by which structure?", c: "Ligamentum patellae", i: ["Iliotibial band", "Biceps femoris tendon", "Medial collateral ligament", "Patellar retinaculum"], r: "The Tibial Tuberosity is anterior (attachment of ligamentum patellae)." },
            { q: "A 6-month-old infant has a normal radiograph of the hip. Which of the following ossification centers should normally be present by this age?", c: "None of the primary or secondary centers mentioned", i: ["Head of femur", "Greater trochanter", "Lesser trochanter", "Lower end of femur"], r: "The head of femur appears at 1st year. Greater trochanter appears at 4 years. Lesser trochanter appears at 12 years." },
            { q: "In an anatomical study of the femur, the linea aspera is found in which third of the shaft?", c: "Middle 1/3rd", i: ["Upper 1/3rd", "Lower 1/3rd", "All along the shaft", "Posterior to the intercondylar fossa"], r: "Middle 1/3rd borders include the posterior border (Linea aspera)." },
            { q: "A patient has a severe fracture of the femoral shaft. Which surface is characteristic of the lower 1/3rd of the femoral shaft?", c: "Popliteal surface", i: ["Anterior surface", "Medial surface", "Lateral surface", "Gluteal surface"], r: "Lower 1/3rd surfaces: (a) Anterior surface, (b) Medial surface, (c) Lateral surface, (d) Popliteal surface." },
            { q: "During an anatomical lecture on the foot, a student is asked to differentiate the metatarsals from the metacarpals. Which of the following describes the shaft taper of metatarsals?", c: "Narrows from base to head", i: ["Thickens from base to head", "Remains uniform", "Narrows from head to base", "Widens in the middle"], r: "Metatarsals narrow from base to head. Metacarpals thicken from base to head." },
            
            // DIRECT RECALL (20 Questions)
            { q: "The skeleton of the lower limb is adapted for which dual functions?", c: "Weight bearing and locomotion", i: ["Prehension and manipulation", "Protection and hematopoiesis", "Balance and thermoregulation", "Support and respiration"], r: "The bones of the lower limb are adapted for the dual functions of weight bearing and locomotion." },
            { q: "The hip bone is formed by the fusion of three bones. Which of the following is the superior part?", c: "Ilium", i: ["Ischium", "Pubis", "Sacrum", "Acetabulum"], r: "Hip Bone parts: Ilium (superiorly), ischium (posteroinferiorly), and pubis (anteromedially)." },
            { q: "Which primary center of ossification for the hip bone appears at the 2nd month of intrauterine life?", c: "Ilium", i: ["Ischium", "Pubis", "Iliac crest", "Ischial tuberosity"], r: "Ilium primary center appears at 2nd month of IUL." },
            { q: "The iliac crest secondary ossification center appears at puberty and fuses at what age?", c: "20–25 years", i: ["18 years", "16 years", "25–30 years", "30 years"], r: "Iliac Crest (2 centers): Appears at puberty | Fuses at 20–25 years." },
            { q: "The Y-shaped acetabular cartilage fuses at what age?", c: "17–18 years", i: ["20–25 years", "14 years", "16 years", "20 years"], r: "Y-shaped Acetabular Cartilage (2 centers): Appears at puberty | Fuses at 17–18 years." },
            { q: "What is the angle of inclination (neck-shaft angle) of the femur in adults?", c: "125°", i: ["135°", "115°", "90°", "150°"], r: "The Angle of Inclination is 125° in adults." },
            { q: "What is the angle of femoral torsion in females?", c: "~12°", i: ["~7°", "~15°", "~20°", "~5°"], r: "The Angle of Femoral Torsion is ~7° in males, ~12° in females." },
            { q: "Which muscle inserts onto the lesser trochanter of the femur?", c: "Iliopsoas", i: ["Gluteus maximus", "Gluteus medius", "Piriformis", "Rectus femoris"], r: "The Lesser Trochanter is a postero-medial prominence for iliopsoas insertion." },
            { q: "Which border is found in the upper 1/3rd of the shaft of the femur?", c: "Spiral line", i: ["Linea aspera", "Medial supracondylar line", "Lateral supracondylar line", "Popliteal line"], r: "Upper 1/3rd borders: Medial border, Lateral border, Spiral line, Gluteal tuberosity (Lateral lip)." },
            { q: "The shaft of the femur is described as:", c: "Cylindrical and convex forwards", i: ["Triangular and concave forwards", "Cylindrical and concave backwards", "Flattened and straight", "Triangular and convex laterally"], r: "The Shaft of the femur is cylindrical and convex forwards." },
            { q: "The secondary ossification center of the femur at the head appears at:", c: "1st year", i: ["9th month of IUL", "4 years", "12 years", "7th week of IUL"], r: "Head: Appears 1st year | Fuses 18 years." },
            { q: "The largest sesamoid bone in the body is the:", c: "Patella", i: ["Fabella", "Calcaneus", "Talus", "Navicular"], r: "The patella is the largest sesamoid bone, embedded in the quadriceps femoris tendon." },
            { q: "On the posterior surface of the patella, which facet is smaller?", c: "Medial facet", i: ["Lateral facet", "Superior facet", "Inferior facet", "Anterior facet"], r: "The posterior surface of the patella is divided by a vertical ridge into a large lateral facet and a smaller medial facet." },
            { q: "Which of the following is a feature of the upper end of the tibia?", c: "Tibial tuberosity", i: ["Soleal line", "Medial malleolus", "Anterior border", "Lateral malleolus"], r: "The Tibial Tuberosity is anterior (attachment of ligamentum patellae) on the upper end." },
            { q: "The posterior surface of the shaft of the tibia is marked by which line?", c: "Soleal line", i: ["Linea aspera", "Spiral line", "Gluteal line", "Supracondylar line"], r: "The Posterior Surface of the tibia is marked by the Soleal Line." },
            { q: "How many phalangeal bones does the great toe have?", c: "2", i: ["3", "4", "1", "5"], r: "Phalangeal Bones (14 total): 2 for the great toe, 3 for the other four toes." },
            { q: "The 5th metatarsal has a prominent tuberosity at its base called the:", c: "Styloid process", i: ["Medial malleolus", "Lateral malleolus", "Sesamoid bone", "Navicular tuberosity"], r: "The 5th metatarsal has a prominent styloid process (tuberosity) at its base." },
            { q: "How are the metatarsals numbered?", c: "1 to 5 (Medial to Lateral)", i: ["1 to 5 (Lateral to Medial)", "1 to 5 (Superior to Inferior)", "1 to 5 (Anterior to Posterior)", "5 to 1 (Medial to Lateral)"], r: "Numbering: Metatarsals: 1 to 5 (Medial to Lateral). Metacarpals: 1 to 5 (Lateral to Medial)." },
            { q: "Which part of the fibula is a pressure epiphysis?", c: "Lower end", i: ["Upper end", "Head", "Neck", "Shaft"], r: "The lower end is a pressure epiphysis while the upper end is a traction epiphysis." },
            { q: "When does the lower end of the fibula unite?", c: "16 years", i: ["18 years", "20 years", "14 years", "1st year"], r: "The lower end of the fibula appears first (1st year) and unites first (16 years)." }
        ];

        let candidateID = ""; 
        let candidateDept = ""; 
        let questions = []; 
        let currentQ = 0; 
        let answers = {}; 
        let flagged = {}; 
        let timeLeft = TOTAL_TIME_SECONDS; 
        let isSubmitted = false; 
        let timerInterval;
        let examStartTime = 0;
        const appDiv = document.getElementById('app');

        window.addEventListener('beforeunload', (e) => {
            if (!isSubmitted && candidateID && timeLeft > 0) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        const icons = {
            user: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
            book: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" /></svg>`,
            clock: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>`,
            x: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`,
            flag: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" /></svg>`,
            flagSolid: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 6a3 3 0 013-3h10a1 1 0 01.8 1.6L14.25 8l2.55 3.4A1 1 0 0116 13H6a1 1 0 00-1 1v3a1 1 0 11-2 0V6z" clip-rule="evenodd" /></svg>`
        };

        const optionLetters = ['A', 'B', 'C', 'D', 'E'];

        function getActiveStateKey(id) { return `tlt_active_exam_${EXAM_KEY}_${id}`; }

        function saveActiveState() {
            if (!candidateID || isSubmitted) return;
            const state = { candidateID, candidateDept, questions, currentQ, answers, flagged, examStartTime, totalTime: TOTAL_TIME_SECONDS };
            localStorage.setItem(getActiveStateKey(candidateID), JSON.stringify(state));
        }

        function clearActiveState() {
            if (candidateID) localStorage.removeItem(getActiveStateKey(candidateID));
        }

        function initApp() {
            const rawSession = localStorage.getItem('tlt_session');
            let sessionID = "";
            if (rawSession) { try { sessionID = JSON.parse(rawSession).id || ""; } catch(e) {} }

            if (sessionID) {
                const activeStateRaw = localStorage.getItem(getActiveStateKey(sessionID));
                if (activeStateRaw) {
                    try {
                        const state = JSON.parse(activeStateRaw);
                        const elapsed = Math.floor((Date.now() - state.examStartTime) / 1000);
                        const remaining = state.totalTime - elapsed;

                        if (remaining > 0) {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;
                            questions = state.questions; currentQ = state.currentQ || 0;
                            answers = state.answers || {}; flagged = state.flagged || {};
                            timeLeft = remaining; examStartTime = state.examStartTime;
                            startTimer(); renderExam(); return;
                        } else {
                            candidateID = state.candidateID; candidateDept = state.candidateDept;
                            questions = state.questions; answers = state.answers || {}; 
                            flagged = state.flagged || {}; timeLeft = 0;
                            clearActiveState(); submitQuiz(); return;
                        }
                    } catch(e) {}
                }
            }

            renderLogin();
            if (sessionID) {
                const idField = document.getElementById('cand-id');
                if (idField) { idField.value = sessionID; validateInput(); }
            }
        }

        function validateInput() {
            const idInput = document.getElementById('cand-id').value.trim().toUpperCase();
            const dInput = document.getElementById('cand-dept').value.trim();
            const btn = document.getElementById('start-btn');
            const errorMsg = document.getElementById('id-error');
            const isValidId = /^TLT260(59\d{2}|60\d{2}|6100)$/.test(idInput);
            
            if (idInput !== "" && !isValidId) errorMsg.classList.remove('opacity-0');
            else errorMsg.classList.add('opacity-0');

            if (isValidId && dInput) { 
                btn.disabled = false; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/50 transition-all active:scale-[0.98]"; 
            } else { 
                btn.disabled = true; 
                btn.className = "w-full py-3.5 mt-2 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all"; 
            }
        }

        function startExam() {
            candidateID = document.getElementById('cand-id').value.trim().toUpperCase(); 
            candidateDept = document.getElementById('cand-dept').value.trim();
            localStorage.setItem('tlt_session', JSON.stringify({ id: candidateID, timestamp: Date.now() }));

            questions = rawQuestions.sort(() => Math.random() - 0.5).map(q => { 
                const opts = [q.c, ...q.i].sort(() => Math.random() - 0.5); 
                return { ...q, options: opts }; 
            });

            examStartTime = Date.now(); timeLeft = TOTAL_TIME_SECONDS;
            saveActiveState(); startTimer(); renderExam();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
                timeLeft = TOTAL_TIME_SECONDS - elapsed;

                if (timeLeft > 0 && !isSubmitted) { 
                    const display = document.getElementById('timer-display');
                    if (display) { 
                        display.innerText = formatTime(timeLeft); 
                        if (timeLeft < 300) display.parentElement.classList.add('text-red-400', 'animate-pulse'); 
                    }
                } else if (timeLeft <= 0 && !isSubmitted) {
                    clearInterval(timerInterval); submitQuiz();
                }
            }, 1000);
        }

        function renderLogin() {
            const timeInMinutes = Math.floor(TOTAL_TIME_SECONDS / 60);
            appDiv.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full p-8 md:p-12">
                    <div class="w-16 h-16 bg-blue-900/50 text-blue-400 rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-blue-800/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-900/30 px-3 py-1 rounded border border-blue-800/30 mb-3">${EXAM_SUBJECT}</span>
                    <h1 class="text-3xl font-bold text-white tracking-tight text-center mb-2">${EXAM_TOPIC}</h1>
                    <p class="text-slate-400 text-center mb-8 max-w-sm">Enter details to proceed. You have <strong>${timeInMinutes} minutes</strong> for <strong>${rawQuestions.length} questions</strong>.</p>
                    <div class="w-full max-w-md space-y-4">
                        <form onsubmit="event.preventDefault(); if(!document.getElementById('start-btn').disabled) startExam();" class="w-full">
                            <div class="relative mb-4">${icons.user}<input type="text" id="cand-id" name="tlt_exam_cand_id" autocomplete="username" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all text-white placeholder:text-slate-600 font-mono uppercase" placeholder="ID (e.g. TLT2605900)"><p id="id-error" class="text-xs text-red-400 mt-1.5 font-medium ml-1 opacity-0 transition-opacity">Access Denied. ID not in registry.</p></div>
                            <div class="relative">${icons.book}<input type="text" id="cand-dept" oninput="validateInput()" class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:bg-slate-900 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all text-white placeholder:text-slate-600" placeholder="Department / Course"></div>
                            <button type="submit" id="start-btn" disabled class="w-full py-3.5 mt-6 rounded-xl font-semibold text-slate-500 bg-slate-800 cursor-not-allowed transition-all">Start Assessment</button>
                        </form>
                    </div>
                </div>`;
        }

        function renderExam() {
            let savedScroll = 0;
            const existingGrid = document.getElementById('q-nav-grid');
            if (existingGrid) savedScroll = existingGrid.scrollLeft;

            const q = questions[currentQ]; 
            const hasAnsweredAll = Object.keys(answers).length === questions.length; 
            const progressPct = (Object.keys(answers).length / questions.length) * 100;
            const isFlagged = flagged[currentQ] || false;
            
            let gridHTML = `<div id="q-nav-grid" class="flex gap-2 overflow-x-auto pb-3 custom-scroll mb-6">`;
            questions.forEach((_, idx) => {
                const isAns = answers[idx] !== undefined; 
                const isCurr = idx === currentQ;
                const isF = flagged[idx];
                let btnClass = "min-w-[36px] h-9 rounded-lg font-medium text-xs flex items-center justify-center transition-all flex-shrink-0 cursor-pointer ";
                if (isCurr && isAns) btnClass += "bg-blue-600 text-white shadow-md shadow-blue-500/30";
                else if (isCurr) btnClass += "border-2 border-blue-500 text-blue-400 bg-blue-950/50";
                else if (isF) btnClass += "bg-yellow-900/50 text-yellow-400 border border-yellow-700/50 hover:bg-yellow-900";
                else if (isAns) btnClass += "bg-slate-800 text-slate-200 hover:bg-slate-700";
                else btnClass += "bg-slate-950 text-slate-500 border border-slate-800 hover:border-slate-700 hover:text-slate-300";
                gridHTML += `<div id="q-btn-${idx}" onclick="jumpToQ(${idx})" class="${btnClass}">${idx + 1}</div>`;
            }); 
            gridHTML += `</div>`;

            let optionsHTML = `<div class="space-y-3 mt-6">`;
            q.options.forEach((opt, idx) => {
                const isSelected = answers[currentQ] === opt;
                optionsHTML += `<button onclick="selectOption(${idx})" class="option-btn w-full text-left p-4 rounded-xl border-2 ${isSelected ? 'border-blue-500 bg-blue-950/40' : 'border-slate-800 bg-slate-950/50 hover:border-slate-700 hover:bg-slate-900'}">
                    <div class="flex items-start gap-4">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mt-0.5 flex-shrink-0 font-bold text-xs ${isSelected ? 'border-blue-500 bg-blue-600 text-white' : 'border-slate-700 text-slate-500'}">${optionLetters[idx]}</div>
                        <span class="text-slate-200 text-base leading-relaxed ${isSelected ? 'font-medium text-white' : ''}">${opt}</span>
                    </div>
                </button>`;
            }); 
            optionsHTML += `</div>`;

            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center flex-wrap gap-4 border-b border-slate-800">
                    <div class="flex-1 min-w-0">
                        <span class="text-[11px] font-bold text-blue-400 uppercase tracking-widest">${EXAM_SUBJECT}</span>
                        <h2 class="text-sm font-bold text-slate-200">${EXAM_TOPIC}</h2>
                        <div class="text-xs mt-1 font-mono text-slate-400 truncate">${candidateID} <span class="text-slate-600 mx-1">•</span> <span class="font-sans">${candidateDept}</span></div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                        <button onclick="toggleFlag()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border ${isFlagged ? 'bg-yellow-900/40 border-yellow-700/50 text-yellow-400' : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-white'} transition-colors text-xs font-semibold">
                            ${isFlagged ? icons.flagSolid : icons.flag} ${isFlagged ? 'Flagged' : 'Flag for Review'}
                        </button>
                        <div class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-lg border border-slate-800 font-mono text-lg font-bold text-blue-400 shadow-inner">${icons.clock}<span id="timer-display">${formatTime(Math.max(0, timeLeft))}</span></div>
                    </div>
                </div>
                <div class="h-1 w-full bg-slate-950"><div class="h-full bg-blue-500 transition-all duration-300" style="width: ${progressPct}%"></div></div>
                <div class="p-6 md:p-8 flex-1 flex flex-col">
                    ${gridHTML}
                    <div class="flex-1"><div class="flex items-start gap-4 mb-2"><span class="text-4xl font-black text-slate-700">${currentQ + 1}</span><h2 class="text-xl md:text-2xl font-semibold text-white leading-snug mt-1">${q.q}</h2></div>${optionsHTML}</div>
                    <div class="mt-10 flex justify-between items-center"><button onclick="changeQ(-1)" class="px-6 py-3 rounded-xl font-medium text-slate-300 bg-slate-800 hover:bg-slate-700 transition-colors disabled:opacity-30 disabled:cursor-not-allowed" ${currentQ === 0 ? 'disabled' : ''}>← Previous</button>${hasAnsweredAll || currentQ === questions.length - 1 ? `<button onclick="submitQuiz()" class="px-8 py-3 rounded-xl font-bold text-white bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/30 transition-all active:scale-95">Submit Exam</button>` : `<button onclick="changeQ(1)" class="px-8 py-3 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-md active:scale-95">Next →</button>`}</div>
                </div>`;

            const newGrid = document.getElementById('q-nav-grid');
            if (newGrid) {
                newGrid.scrollLeft = savedScroll;
                const activeBtn = document.getElementById(`q-btn-${currentQ}`);
                if (activeBtn) {
                    const gridRect = newGrid.getBoundingClientRect();
                    const btnRect = activeBtn.getBoundingClientRect();
                    if (btnRect.left < gridRect.left || btnRect.right > gridRect.right) {
                        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }
            }
        }

        async function submitQuiz() {
            isSubmitted = true; clearInterval(timerInterval); clearActiveState();

            appDiv.innerHTML = `<div class="flex flex-col items-center justify-center h-full p-12"><div class="w-12 h-12 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-4"></div><p class="text-slate-400 font-medium animate-pulse">Calculating score & transmitting verification...</p></div>`;
            
            const elapsed = Math.floor((Date.now() - examStartTime) / 1000);
            const timeSpentSeconds = Math.min(TOTAL_TIME_SECONDS, elapsed > 0 ? elapsed : TOTAL_TIME_SECONDS - timeLeft); 
            
            let score = 0;
            questions.forEach((q, index) => { if (answers[index] === q.c) score++; });
            const percentage = Math.round((score / questions.length) * 100); 
            let emailStatus = "";

            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const newRecord = { examTitle: EXAM_TOPIC, subject: EXAM_SUBJECT, score, total: questions.length, percent: percentage, date: dateStr, time: timeStr };

            try {
                const storageKey = 'tlt_score_history_' + candidateID;
                const existingHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
                existingHistory.unshift(newRecord);
                localStorage.setItem(storageKey, JSON.stringify(existingHistory));
            } catch(e) {}

            if (WEB3FORMS_ACCESS_KEY) {
                try {
                    const response = await fetch('https://api.web3forms.com/submit', { 
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, 
                        body: JSON.stringify({ access_key: WEB3FORMS_ACCESS_KEY, name: candidateID, email: "system@mockexam.com", subject: `Exam Result: ${candidateID} - ${percentage}% (${EXAM_TOPIC})`, from_name: "Mock Exam Portal", Subject: EXAM_SUBJECT, Topic: EXAM_TOPIC, Candidate_ID: candidateID, Department: candidateDept, Score: `${score} out of ${questions.length} (${percentage}%)`, Time_Spent: formatTime(timeSpentSeconds) }) 
                    });
                    if (response.status === 200) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-green-950/60 text-green-400 text-sm font-semibold rounded-full border border-green-800/60">${icons.check} Result verified & logged</div>`; } else { throw new Error("Failed"); }
                } catch (e) { emailStatus = `<div class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-red-950/60 text-red-400 text-sm font-semibold rounded-full border border-red-800/60">${icons.x} Verification offline. Saved locally.</div>`; }
            } 
            renderResults(score, percentage, emailStatus, dateStr, timeStr);
        }

        let currentResultFilter = 'all';

        function renderResults(score, percentage, emailStatus, dateStr, timeStr) {
            const strokeColor = percentage >= 70 ? '#22c55e' : percentage >= 50 ? '#f59e0b' : '#ef4444';
            
            appDiv.innerHTML = `
                <div class="bg-slate-950 text-white p-6 md:p-8 text-center border-b border-slate-800">
                    <span class="inline-block text-[11px] font-bold tracking-widest uppercase bg-blue-900/40 text-blue-400 border border-blue-800/50 px-3 py-1 rounded mb-2">${EXAM_SUBJECT}</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${EXAM_TOPIC}</h1>
                    <div class="flex justify-center items-center gap-4 mt-3 pt-3 border-t border-slate-800/80 font-mono text-xs text-slate-400">
                        <span class="text-blue-400 font-bold">${candidateID}</span> <span class="text-slate-600">•</span> <span class="text-slate-300 font-sans">${candidateDept}</span> <span class="text-slate-600">•</span> <span>${dateStr} ${timeStr}</span>
                    </div>
                </div>

                <div class="p-6 md:p-8 text-center border-b border-slate-800">
                    <div class="relative w-40 h-40 mx-auto mb-2">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="circle" stroke="${strokeColor}" stroke-dasharray="${percentage}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <text x="18" y="21" class="percentage">${percentage}%</text>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-black text-white mb-2">${score} / ${questions.length} Correct</h2>
                    <p class="text-xs text-slate-400 mb-6 uppercase tracking-wider font-semibold">${percentage >= 70 ? 'Distinction Standard' : percentage >= 50 ? 'Pass Standard' : 'Requires Revision'}</p>
                    <div class="flex justify-center">
                        <a href="index.html" class="inline-flex items-center justify-center px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-all text-sm shadow-lg shadow-blue-900/30 active:scale-95">Return to Dashboard</a>
                    </div>
                    ${emailStatus}
                </div>

                <div class="p-6 md:p-10 bg-slate-950 flex-1">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h3 class="text-lg font-bold text-white">Question Analysis</h3>
                        <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-800 overflow-x-auto custom-scroll w-full md:w-auto">
                            <button onclick="setResultFilter('all')" id="filter-btn-all" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white whitespace-nowrap">All</button>
                            <button onclick="setResultFilter('correct')" id="filter-btn-correct" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Correct</button>
                            <button onclick="setResultFilter('incorrect')" id="filter-btn-incorrect" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Incorrect</button>
                            <button onclick="setResultFilter('answered')" id="filter-btn-answered" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Answered</button>
                            <button onclick="setResultFilter('unanswered')" id="filter-btn-unanswered" class="px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap">Unanswered</button>
                        </div>
                    </div>
                    <div id="results-container" class="space-y-6"></div>
                </div>
            `;
            currentResultFilter = 'all';
            renderResultQuestions();
        }

        function setResultFilter(filter) {
            currentResultFilter = filter;
            ['all', 'correct', 'incorrect', 'answered', 'unanswered'].forEach(f => {
                const btn = document.getElementById(`filter-btn-${f}`);
                if (f === filter) btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-blue-600 text-white whitespace-nowrap";
                else btn.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white whitespace-nowrap";
            });
            renderResultQuestions();
        }

        function renderResultQuestions() {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            let count = 0;

            questions.forEach((q, index) => {
                const userAns = answers[index]; 
                const isCorrect = userAns === q.c;
                const isAnswered = userAns !== undefined;
                
                if (currentResultFilter === 'correct' && !isCorrect) return;
                if (currentResultFilter === 'incorrect' && (isCorrect || !isAnswered)) return;
                if (currentResultFilter === 'answered' && !isAnswered) return;
                if (currentResultFilter === 'unanswered' && isAnswered) return;

                count++;
                const icon = isCorrect ? `<div class="w-8 h-8 rounded-full bg-green-950 text-green-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-green-800">${icons.check}</div>` : `<div class="w-8 h-8 rounded-full bg-red-950 text-red-400 flex items-center justify-center flex-shrink-0 mt-0.5 border border-red-800">${icons.x}</div>`;
                
                container.innerHTML += `<div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-sm flex gap-4">${icon}<div class="flex-1"><p class="font-semibold text-white text-base md:text-lg mb-4 leading-snug"><span class="text-slate-500 font-bold mr-2">${index + 1}.</span>${q.q}</p><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"><div class="bg-slate-950 p-3 rounded-lg border border-slate-800"><span class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Your Answer</span><span class="${isCorrect ? 'text-green-400' : 'text-red-400 line-through'} font-medium">${userAns || 'Not Answered'}</span></div>${!isCorrect ? `<div class="bg-green-950/40 p-3 rounded-lg border border-green-900/50"><span class="block text-xs font-bold text-green-500 uppercase tracking-wider mb-1">Correct Answer</span><span class="text-green-300 font-medium">${q.c}</span></div>` : ''}</div><div class="bg-blue-950/30 p-4 rounded-xl border border-blue-900/40"><span class="flex items-center gap-2 font-bold text-blue-400 text-xs uppercase tracking-wider mb-2">Rationale</span><p class="text-sm text-slate-300 leading-relaxed">${q.r}</p></div></div></div>`;
            });

            if (count === 0) {
                container.innerHTML = `<p class="text-slate-500 text-center py-8">No questions match this filter.</p>`;
            }
        }

        function formatTime(seconds) { 
            const m = Math.floor(seconds / 60).toString().padStart(2, '0'); 
            const s = (seconds % 60).toString().padStart(2, '0'); 
            return `${m}:${s}`; 
        }

        window.selectOption = function(idx) { 
            if (isSubmitted) return; 
            answers[currentQ] = questions[currentQ].options[idx]; 
            saveActiveState(); renderExam(); 
        }
        window.changeQ = function(delta) { 
            if (isSubmitted) return; 
            const newQ = currentQ + delta; 
            if (newQ >= 0 && newQ < questions.length) { 
                currentQ = newQ; saveActiveState(); renderExam(); 
            } 
        }
        window.jumpToQ = function(idx) { 
            if (isSubmitted) return; 
            currentQ = idx; saveActiveState(); renderExam(); 
        }
        window.toggleFlag = function() {
            if (isSubmitted) return;
            flagged[currentQ] = !flagged[currentQ];
            saveActiveState(); renderExam();
        }

        initApp();
    </script>
</body>
</html>
